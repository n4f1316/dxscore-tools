<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2fRATE ランキング（管理者用）</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
  :root { --ink: #2B2350; --sub: #6E6892; --line: #E4DFF3; --bg: #F6F4FC; --card: #FFFFFF; --pink: #E0348C; --cyan: #1FA9C9; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 14px/1.6 "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 18px 14px 48px; }
  h1 { font-size: 22px; font-weight: 800; margin: 0; }
  .lead { color: var(--sub); font-size: 13px; margin: 4px 0 0; }
  .status { margin-top: 12px; color: var(--sub); font-size: 13px; }
  .status.error { color: #E0434B; font-weight: 700; }
  button { font: inherit; font-weight: 700; padding: 6px 14px; border-radius: 999px; cursor: pointer;
    border: 1.5px solid var(--line); background: var(--card); color: var(--ink); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
  .tab-label { align-self: center; font-size: 12px; font-weight: 800; color: var(--sub); margin-right: 2px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 0; }
  .tabs button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .search { width: 100%; margin-top: 12px; font: inherit; padding: 8px 14px; border-radius: 999px;
    border: 1.5px solid var(--line); background: var(--card); color: var(--ink); }
  .info { font-size: 12px; font-weight: 700; color: var(--sub); margin: 12px 2px 6px; }
  .list { background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; overflow: hidden; }
  .r { display: grid; grid-template-columns: 40px 48px 1fr auto; gap: 12px; align-items: center;
    padding: 10px 14px; border-top: 1px solid var(--line); }
  .r:first-child { border-top: 0; }
  .r:nth-child(even) { background: #FBFAFE; }
  .pos { text-align: center; font-weight: 800; font-size: 18px; color: var(--sub); font-variant-numeric: tabular-nums; }
  .pos.top1 { color: #C98A00; } .pos.top2 { color: #7D8A99; } .pos.top3 { color: #9C5A2B; }
  .icon { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; background: #EFECF9; display: block; }
  .name { font-weight: 800; font-size: 15px; line-height: 1.35; word-break: break-all; }
  .name.anon { color: var(--sub); }
  .meta { font-size: 11px; color: var(--sub); }
  .rate { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
  .rate-value { font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; }
  .rate-value.ranked { color: transparent; -webkit-background-clip: text; background-clip: text; display: inline-block; }
  .rank-icon { width: 30px; height: 30px; flex: none; }
  .rank-icon svg { width: 100%; height: 100%; display: block; }
  .count-unit { font-size: 12px; font-weight: 700; color: var(--sub); margin-left: 3px; }
  .rank-name { font-size: 10px; font-weight: 800; color: var(--sub); text-align: right; letter-spacing: .02em; }
  .empty { padding: 24px; text-align: center; color: var(--sub); }
  .default-icon { overflow: hidden; }
  .default-icon svg { display: block; }
  /* ベスト枠（2fRATE 実行時の表と同じ形式） */
  .bf-overlay { position: fixed; inset: 0; z-index: 50; background: rgba(43,35,80,.5); overflow: auto; padding: 16px 10px 40px; }
  .bf-box { position: relative; max-width: 780px; margin: 0 auto; background: var(--bg); border-radius: 22px; padding: 16px; }
  .bf-close { position: absolute; top: 14px; right: 14px; }
  .bf-head { display: flex; align-items: center; gap: 14px; background: #fff; border: 2px solid var(--line); border-radius: 18px;
    padding: 12px 16px; margin: 36px 0 14px; flex-wrap: wrap; }
  .bf-icon { width: 64px; height: 64px; border-radius: 14px; object-fit: cover; background: #EFECF9; flex: none; }
  .bf-who { flex: 1 1 160px; min-width: 0; }
  .bf-name { font-size: 22px; font-weight: 800; word-break: break-all; line-height: 1.3; }
  .bf-label { font-size: 12px; font-weight: 700; color: var(--sub); }
  .bf-rate { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .bf-rank-icon { width: 40px; height: 40px; flex: none; }
  .bf-rank-icon svg { width: 100%; height: 100%; display: block; }
  .bf-rate-value { font-size: 38px; font-weight: 800; font-variant-numeric: tabular-nums; color: transparent;
    -webkit-background-clip: text; background-clip: text; line-height: 1.1; }
  .bf-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
  .bf-tabs button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .bf-list { background: #fff; border: 1.5px solid var(--line); border-radius: 16px; overflow: hidden; }
  .bf-row { display: grid; grid-template-columns: 30px 44px 1fr 66px 72px 72px; gap: 10px; align-items: center;
    padding: 9px 14px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .bf-row:nth-child(even) { background: #FBFAFE; }
  .bf-hrow { border-top: 0; background: var(--ink) !important; color: #fff; font-size: 11px; font-weight: 700; padding-top: 7px; padding-bottom: 7px; }
  .bf-no { text-align: center; font-weight: 800; color: var(--sub); }
  .bf-jk { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; display: block; background: #EFECF9; box-shadow: 0 0 0 1px var(--line); }
  .bf-title { font-weight: 700; line-height: 1.35; word-break: break-word; }
  .bf-genre { font-size: 11px; font-weight: 700; color: var(--sub); margin-left: 2px; }
  .bf-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 4px; }
  .bf-chip { font-size: 11px; font-weight: 700; line-height: 1; padding: 4px 7px; border-radius: 6px; color: #fff; white-space: nowrap; }
  .bf-kind-DX { background: linear-gradient(90deg, #E0348C, #F29A2E); }
  .bf-kind-ST { background: #3B82C4; }
  .bf-diff.bf-remas { background: #fff; color: #8E44D6; box-shadow: inset 0 0 0 1.5px #B68BE0; }
  .bf-const { background: #EFECF9; color: var(--ink); }
  .bf-maxinline { display: none; font-size: 11px; font-weight: 700; color: var(--sub); padding: 0 2px; line-height: 1.6; }
  .bf-maxinline.is-max { color: #C98A00; }
  .bf-c { text-align: center; }
  .bf-r { text-align: right; }
  .bf-hrow .bf-c, .bf-hrow .bf-r { text-align: center; }
  .bf-maxcol { font-size: 12px; color: var(--sub); }
  .bf-maxcol.is-max { color: #C98A00; font-weight: 800; }
  .bf-hrow .bf-maxcol { color: #fff; font-size: 11px; }
  .bf-star { display: inline-block; min-width: 3.6em; text-align: center; font-size: 13px; font-weight: 800; padding: 3px 7px;
    border-radius: 999px; color: var(--ink); background: #EFECF9; }
  .bf-star.g12 { background: #B5E05A; } .bf-star.g34 { background: #FF8C2E; } .bf-star.g56 { background: #FFE066; }
  .bf-star.g7 { background: linear-gradient(90deg, #FF5E7E, #FFB347, #FFE66D, #7EE081, #5CC8FF, #A78BFA); }
  .bf-value { font-weight: 800; font-size: 15px; }
  .bf-empty { padding: 30px; text-align: center; color: var(--sub); }
  @media (max-width: 520px) {
    .bf-row { grid-template-columns: 22px 40px 1fr 54px 60px; gap: 7px; padding: 9px 10px; }
    .bf-row > .bf-maxcol { display: none; }
    .bf-maxinline { display: inline-block; }
    .bf-jk { width: 40px; height: 40px; }
    .bf-star { min-width: 0; padding: 3px 5px; font-size: 12px; }
    .bf-head { gap: 10px; } .bf-icon { width: 52px; height: 52px; } .bf-name { font-size: 18px; }
    .bf-rate { margin-left: 0; } .bf-rate-value { font-size: 30px; } .bf-rank-icon { width: 32px; height: 32px; }
  }
  .tag.pub { background: #2E9E5B; } .tag.priv { background: #9A94B8; }
  .login { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  .login input { flex: 1 1 220px; font: inherit; padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line); }
  .login button.primary { background: var(--pink); border-color: var(--pink); color: #fff; }
  .r.user { cursor: pointer; }
  .r.user:hover { background: #F3EEFC; }
  .r.open { background: #FDEAF3 !important; }
  .admin-meta { font-size: 11px; color: #9A94B8; }
  .tag { display: inline-block; font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 6px; margin-left: 4px;
    background: #E0434B; color: #fff; vertical-align: middle; }
  /* レート対象曲 */
  .detail { grid-column: 1 / -1; background: #FFFFFF; border: 1.5px solid var(--line); border-radius: 14px; padding: 10px; margin-top: 4px; cursor: default; }
  .detail-head { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; font-size: 12px; font-weight: 700; color: var(--sub); margin: 2px 4px 8px; }
  .t { display: grid; grid-template-columns: 26px 40px 1fr 58px 62px; gap: 8px; align-items: center; padding: 6px 4px; border-top: 1px solid var(--line); }
  .t:first-of-type { border-top: 0; }
  .t-rank { text-align: center; font-weight: 800; color: var(--sub); font-size: 12px; }
  .jacket { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; display: block; background: #EFECF9; }
  .t-name { font-weight: 700; font-size: 13px; line-height: 1.3; word-break: break-word; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
  .chip { display: inline-block; font-size: 10px; font-weight: 700; line-height: 1; padding: 3px 6px; border-radius: 6px; color: #fff; white-space: nowrap; }
  .kind-DX { background: linear-gradient(90deg, #E0348C, #F29A2E); }
  .kind-ST { background: #3B82C4; }
  .diff-BASIC { background: #2E9E5B; } .diff-ADVANCED { background: #D98E04; } .diff-EXPERT { background: #E0434B; }
  .diff-MASTER { background: #8E44D6; } .diff-REMASTER { background: #fff; color: #8E44D6; box-shadow: inset 0 0 0 1.5px #B68BE0; }
  .const { background: #EFECF9; color: var(--ink); }
  .score { background: transparent; color: var(--sub); padding-left: 2px; }
  .star { display: inline-block; text-align: center; font-size: 12px; font-weight: 800; padding: 3px 6px; border-radius: 999px; color: var(--ink); background: #EFECF9; }
  .star.g12 { background: #B5E05A; } .star.g34 { background: #FF8C2E; } .star.g56 { background: #FFE066; }
  .star.g7 { background: linear-gradient(90deg, #FF5E7E, #FFB347, #FFE66D, #7EE081, #5CC8FF, #A78BFA); }
  .t-val { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
  .foot { margin-top: 18px; font-size: 12px; color: var(--sub); line-height: 1.8; }
  @media (max-width: 520px) {
    .r { grid-template-columns: 30px 40px 1fr auto; gap: 8px; padding: 9px 10px; }
    .icon { width: 40px; height: 40px; }
    .pos { font-size: 16px; }
    .rate-value { font-size: 18px; }
    .rank-icon { width: 24px; height: 24px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>2fRATE ランキング（管理者用）</h1>
  <p class="lead">プレイヤーを選ぶと、その人のベスト枠（☆7までのレート対象曲）を表示します。公開・非公開や、非表示（hidden）に関わらず全員分を見られます。</p>
  <form class="login" id="login">
    <input id="key" type="password" placeholder="管理者用の鍵" aria-label="管理者用の鍵" autocomplete="current-password">
    <button class="primary" type="submit">表示する</button>
  </form>
  <div class="status" id="status"></div>
  <div id="app" hidden>
    <div class="tabs" id="modeTabs" role="group" aria-label="レートの種類"></div>
    <div class="tabs" id="verTabs" role="group" aria-label="定数表のバージョン"></div>
    <div class="tabs" id="formulaTabs" role="group" aria-label="計算式の版"></div>
    <input class="search" id="search" type="search" placeholder="名前・ユーザー名で絞り込み" aria-label="名前・ユーザー名で絞り込み">
    <div class="info" id="info"></div>
    <div id="listBox"></div>
    <p class="foot">
      管理者用のページです。鍵はこのページには保存されず、閉じると入力し直しになります。
    </p>
  </div>
</div>
<script>
(() => {
  'use strict';

  const RANKING_API = 'https://2frate.want131611.workers.dev/';
  const ICON_BASE = 'https://maimaidx.jp/maimai-mobile/img/Icon/';
  const JACKETS_URL = 'maimai_jackets.json';
  const OVERRIDES_URL = 'jacket_overrides.json';
  const JACKET_BASES = ['https://maimaidx.jp/maimai-mobile/img/Music/', 'https://maimai.sega.jp/storage/DX_jacket/'];
  const DIFF_NAMES = ['BASIC', 'ADVANCED', 'EXPERT', 'MASTER', 'Re:MASTER'];
  const MODES = [
    { key: 'rateFull', id: 'full', label: '☆7まで', shift: 0 },   // LEGEND 12.000 以上
    { key: 'rateCap6', id: 'cap6', label: '☆6まで', shift: 0.5 }, // LEGEND 11.500 以上
    { key: 'rateCap5', id: 'cap5', label: '☆5まで', shift: 1.5 }, // LEGEND 10.500 以上
    // ☆7・☆6・☆5 を達成した MASTER / Re:MASTER の譜面数で並べる（count: true）
    { id: 'star7', label: '☆7達成数', count: true, mas: 'star7Mas', re: 'star7Remas' },
    { id: 'star6', label: '☆6達成数', count: true, mas: 'star6Mas', re: 'star6Remas' },
    { id: 'star5', label: '☆5達成数', count: true, mas: 'star5Mas', re: 'star5Remas' },
  ];
  // ベスト枠の切り替えに使う、レートの種類だけ
  const RATE_MODES = MODES.filter((m) => !m.count);
  // 並べ替えに使う値（レートの値、または達成譜面数の合計。記録がなければ NaN）
  //   ☆5 を数える前の版で登録した記録は、☆5 の数が null なので「☆5達成数」には載せない
  const hasCount = (r, m) => !!r.counts && Number.isFinite(r.counts[m.mas]) && Number.isFinite(r.counts[m.re]);
  const valueOf = (r, m) => (m.count ? (hasCount(r, m) ? r.counts[m.mas] + r.counts[m.re] : NaN) : r[m.key]);
  // 名前の下に出す達成譜面数（記録がなければ空）
  const countsText = (r) => '達成譜面数 ' + MODES.filter((m) => m.count && hasCount(r, m))
    .map((m) => `${m.label.replace('達成数', '')} ${valueOf(r, m)}`).join('・');

  // ランク（2fRATE と同じ区切りと色）。min は「☆7まで」の区切りで、☆6まで・☆5まで は MODES の shift だけ下げて判定する
  const RANKS = [
    { name: 'LEGEND',        min: 12,   colors: ['#6A1BD8', '#D6246E', '#F2A007'], glow: 'rgba(242,160,7,.55)' },
    { name: 'RAINBOW PLUS',  min: 11.5, colors: ['#FF3B6B', '#FF8A00', '#E8B400', '#1FB88E', '#2F7BFF', '#8A3FFC'], glow: 'rgba(255,196,0,.6)' },
    { name: 'RAINBOW',       min: 11,   colors: ['#FF3B6B', '#FF8A00', '#E8B400', '#1FB88E', '#2F7BFF', '#8A3FFC'] },
    { name: 'PLATINUM PLUS', min: 10.5, colors: ['#4F8AA6', '#8FBED4', '#4F8AA6'], glow: 'rgba(120,190,225,.65)' },
    { name: 'PLATINUM',      min: 10,   colors: ['#4F8AA6', '#8FBED4', '#4F8AA6'] },
    { name: 'GOLD PLUS',     min: 9.5,  colors: ['#B8860B', '#E0B32E', '#B8860B'], glow: 'rgba(240,190,40,.6)' },
    { name: 'GOLD',          min: 9,    colors: ['#B8860B', '#E0B32E', '#B8860B'] },
    { name: 'SILVER PLUS',   min: 8.5,  colors: ['#6F7C8B', '#A7B2BE', '#6F7C8B'], glow: 'rgba(150,165,185,.7)' },
    { name: 'SILVER',        min: 8,    colors: ['#6F7C8B', '#A7B2BE', '#6F7C8B'] },
    { name: 'BRONZE PLUS',   min: 7.5,  colors: ['#8E4E22', '#C07A45', '#8E4E22'], glow: 'rgba(205,125,65,.55)' },
    { name: 'BRONZE',        min: 7,    colors: ['#8E4E22', '#C07A45', '#8E4E22'] },
    { name: 'WAKABA',        min: -Infinity, colors: ['#3E9B3A', '#7CBF3F'] },
  ];
  const rankOf = (v, shift = 0) => RANKS.find((r) => Math.round(v * 1000) / 1000 >= r.min - shift);
  // ベスト枠のデータを { full, cap6, cap5 } の形にそろえる（古い記録は☆7までの配列だけ）
  const framesOf = (t) => (Array.isArray(t) ? { full: t } : t && typeof t === 'object' ? t : {});

  // ランクのアイコン（SVG）。デフォルメ調：太めの角丸の線、ベタ塗り（ツヤなし）
  function rankIconSvg(rankName) {
    const plus = rankName.endsWith(' PLUS');
    const base = rankName.replace(' PLUS', '');
    // ✧ の形（4方向にとがった星。辺は内側にくぼませる）
    const sparkle = (cx, cy, r) => {
      const q = r * 0.18;
      return `M${cx} ${cy - r} Q${cx + q} ${cy - q} ${cx + r} ${cy} Q${cx + q} ${cy + q} ${cx} ${cy + r}` +
        ` Q${cx - q} ${cy + q} ${cx - r} ${cy} Q${cx - q} ${cy - q} ${cx} ${cy - r} Z`;
    };
    const MEDAL = {            // [中央の✧, 本体, 縁取り]
      BRONZE:   ['#F6D2B3', '#C9844F', '#8E4E22'],
      SILVER:   ['#FFFFFF', '#BAC4CF', '#6F7C8B'],
      GOLD:     ['#FFF2A8', '#F2C531', '#B07D0A'],
      PLATINUM: ['#F4FCFF', '#A6D6EC', '#4F8AA6'],
    };
    let body = '';
    let edge = '#2B2350'; // 「+」の縁取りの色（ランクの色）
    if (base === 'WAKABA') {
      // 初心者マーク（若葉マーク）
      body = `
        <path d="M14 10 L32 22 L32 57 L14 42 Z" fill="#FFD43B" stroke="#D99A00" stroke-width="4" stroke-linejoin="round"/>
        <path d="M50 10 L32 22 L32 57 L50 42 Z" fill="#4CBB4F" stroke="#2E8B3A" stroke-width="4" stroke-linejoin="round"/>`;
      edge = '#2E8B3A';
    } else if (MEDAL[base]) {
      // 丸いメダル（色違い）。中央に ✧
      const [light, mid, dark] = MEDAL[base];
      body = `
        <circle cx="32" cy="34" r="24" fill="${mid}" stroke="${dark}" stroke-width="4"/>
        <path d="${sparkle(32, 34, 13)}" fill="${light}" stroke="${dark}" stroke-width="2.5" stroke-linejoin="round"/>`;
      edge = dark;
    } else if (base === 'RAINBOW') {
      // 虹（四分円の形。6色の帯をすき間なく重ね、端はまっすぐ切る）
      const bands = ['#F0384A', '#FF7A1A', '#FFC93C', '#2CC24A', '#1F6BFF', '#7D55B8'];
      const cx = 51, cy = 51, R = 38, w = (R - 8) / bands.length; // 外側の半径38、内側の穴の半径8（全体が中央に来る位置）
      body = bands.map((c, i) => {
        const r = R - w / 2 - i * w;
        return `<path d="M${cx - r} ${cy} A${r} ${r} 0 0 1 ${cx} ${cy - r}" fill="none" stroke="${c}" stroke-width="${(w + 0.4).toFixed(2)}" stroke-linecap="butt"/>`;
      }).join('');
      // 外側の縁取り（虹全体の輪郭）
      const ri = R - w * bands.length; // 内側の穴の半径
      const line = '#4A3B7A';
      body += `<path d="M${cx - R} ${cy} A${R} ${R} 0 0 1 ${cx} ${cy - R} L${cx} ${cy - ri} A${ri} ${ri} 0 0 0 ${cx - ri} ${cy} Z"` +
        ` fill="none" stroke="${line}" stroke-width="3.5" stroke-linejoin="round"/>`;
      edge = line;
    } else if (base === 'LEGEND') {
      // 王冠
      body = `
        <path d="M10 25 L21 37 L32 18 L43 37 L54 25 L50 50 L14 50 Z" fill="#F2C531" stroke="#B07D0A" stroke-width="4" stroke-linejoin="round"/>
        <rect x="13" y="45" width="38" height="9" rx="4.5" fill="#F2C531" stroke="#B07D0A" stroke-width="4"/>
        <circle cx="10" cy="22" r="4.5" fill="#F2C531" stroke="#B07D0A" stroke-width="3"/>
        <circle cx="32" cy="14" r="4.5" fill="#F2C531" stroke="#B07D0A" stroke-width="3"/>
        <circle cx="54" cy="22" r="4.5" fill="#F2C531" stroke="#B07D0A" stroke-width="3"/>
        <circle cx="32" cy="36" r="4.2" fill="#E0348C" stroke="#9C1D5E" stroke-width="2"/>`;
      edge = '#B07D0A';
    }
    // PLUS は右上に「+」（白い + をランクの色で縁取り）
    const badge = plus ? `
        <path d="M50 6 V20 M43 13 H57" stroke="${edge}" stroke-width="10" stroke-linecap="round"/>
        <path d="M50 6 V20 M43 13 H57" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>` : '';
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">${body}${badge}</svg>`;
  }

  const $ = (id) => document.getElementById(id);
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  // 初期アイコン（アイコンが登録されていない人・読み込めなかったとき用）
  //   2fRATE の配色で、丸い顔と肩だけのシンプルな人型。どこにも通信しない固定のSVG
  const DEFAULT_ICON_SVG =
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" aria-hidden="true">' +
    '<rect width="64" height="64" fill="#E9E4F7"/>' +
    '<circle cx="32" cy="25" r="11" fill="#B9AEDD"/>' +
    '<path d="M12 60c0-11 9-19 20-19s20 8 20 19z" fill="#B9AEDD"/>' +
    '</svg>';
  function defaultIcon(cls) {
    const d = el('div', cls + ' default-icon');
    d.innerHTML = DEFAULT_ICON_SVG;
    return d;
  }

  function dateOf(v) {
    const d = new Date(v);
    if (isNaN(d)) return '';
    const p = (x) => String(x).padStart(2, '0');
    return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())}`;
  }

  function resolveSong(map, overrides, name, kind, diff, level, max) {
    const v = map?.get(name);
    if (!v) return null;
    if (typeof v === 'string') return { img: v, genre: null };
    if (!Array.isArray(v)) return null;
    const g = overrides?.[`${name}|${kind}|${diff}|${max}`];
    if (g) { const c = v.find((x) => x.genre === g); if (c) return { img: c.img, genre: c.genre }; }
    const k = kind === 'ST' ? 'st' : 'dx';
    const i = DIFF_NAMES.indexOf(diff);
    const hits = v.filter((c) => c[k]?.[i] === level);
    return hits.length === 1 ? { img: hits[0].img, genre: hits[0].genre } : null;
  }
  function jacketEl(file) {
    if (!file) return el('div', 'jacket');
    const img = el('img', 'jacket');
    let i = 0;
    img.alt = '';
    img.loading = 'lazy';
    img.src = JACKET_BASES[0] + file;
    img.onerror = () => { i++; if (i < JACKET_BASES.length) img.src = JACKET_BASES[i] + file; else img.replaceWith(el('div', 'jacket')); };
    return img;
  }
  const starClass = (s) => (s >= 7 ? 'g7' : s >= 5 ? 'g56' : s >= 3 ? 'g34' : s >= 1 ? 'g12' : '');

  // ============================================================
  //  ベスト枠の表示（2fRATE の画像化と同じ見た目。5列のカード）
  // ============================================================
  const BF_DIFF_COLOR = { BASIC: '#2E9E5B', ADVANCED: '#D98E04', EXPERT: '#E0434B', MASTER: '#8E44D6' };
  const bfStarClass = (s) => (s >= 7 ? 'g7' : s >= 5 ? 'g56' : s >= 3 ? 'g34' : s >= 1 ? 'g12' : '');

  function bfResolveSong(map, overrides, name, kind, diff, level, max) {
    const v = map?.get(name);
    if (!v) return null;
    if (typeof v === 'string') return { img: v, genre: null };
    if (!Array.isArray(v)) return null;
    const g = overrides?.[`${name}|${kind}|${diff}|${max}`];
    if (g) { const c = v.find((x) => x.genre === g); if (c) return { img: c.img, genre: c.genre }; }
    const k = kind === 'ST' ? 'st' : 'dx';
    const i = ['BASIC', 'ADVANCED', 'EXPERT', 'MASTER', 'Re:MASTER'].indexOf(diff);
    const hits = v.filter((c) => c[k]?.[i] === level);
    return hits.length === 1 ? { img: hits[0].img, genre: hits[0].genre } : null;
  }

  // player: { name, icon, rateFull, rateCap6, rateCap5 }、frames: { full, cap6, cap5 }（それぞれ譜面の配列）
  // jk: { map, overrides }、startId: 最初に表示するレートの種類
  function openBestFrame(player, frames, jk, startId = 'full') {
    const ov = el('div', 'bf-overlay');
    const box = el('div', 'bf-box');
    box.setAttribute('role', 'dialog');
    box.setAttribute('aria-modal', 'true');
    box.setAttribute('aria-label', `${player.name} のベスト枠`);
    ov.appendChild(box);
    const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);
    ov.addEventListener('click', (e) => { if (e.target === ov) close(); });

    // 上部：アイコン・名前・レート
    const head = el('div', 'bf-head');
    if (player.icon) {
      const img = el('img', 'bf-icon');
      img.src = ICON_BASE + player.icon;
      img.alt = '';
      img.onerror = () => img.replaceWith(defaultIcon('bf-icon'));
      head.appendChild(img);
    } else {
      head.appendChild(defaultIcon('bf-icon'));
    }
    const who = el('div', 'bf-who');
    const label = el('div', 'bf-label');
    who.append(el('div', 'bf-name', player.name), label);
    head.appendChild(who);
    const rate = el('div', 'bf-rate');
    head.appendChild(rate);
    const x = el('button', 'bf-close', '閉じる');
    x.type = 'button';
    x.onclick = close;
    // レートの種類の切り替え
    const tabs = el('div', 'bf-tabs');
    box.append(x, head, tabs);

    let list = null;
    function show(id) {
      const m = RATE_MODES.find((x) => x.id === id) || RATE_MODES[0];
      const top50 = Array.isArray(frames[m.id]) ? frames[m.id] : null;
      // タブ
      tabs.replaceChildren(...RATE_MODES.map((x) => {
        const b = el('button', '', x.label);
        b.type = 'button';
        b.setAttribute('aria-pressed', String(x === m));
        b.onclick = () => show(x.id);
        return b;
      }));
      // 上部のレート（ランクの色）
      label.textContent = `2fRATE（${m.label}）`;
      rate.replaceChildren();
      const v = player[m.key];
      if (Number.isFinite(v)) {
        const rank = rankOf(v, m.shift);
        const ic = el('span', 'bf-rank-icon');
        ic.innerHTML = rankIconSvg(rank.name); // ページ内で作る固定のSVGのみ
        const val = el('span', 'bf-rate-value', v.toFixed(3));
        val.style.backgroundImage = `linear-gradient(90deg, ${rank.colors.join(', ')})`;
        if (rank.glow) val.style.filter = `drop-shadow(0 0 3px ${rank.glow})`;
        val.title = rank.name;
        rate.append(ic, val);
      }
      const old = list;
      // 譜面の一覧（2fRATE 実行時の表と同じ形式）
      list = el('div', 'bf-list');
      const hr = el('div', 'bf-row bf-hrow');
      hr.append(el('div', 'bf-no', '#'), el('div'), el('div', '', '曲名'), el('div', 'bf-c', '☆'),
        el('div', 'bf-r bf-maxcol', 'MAX差'), el('div', 'bf-c', 'レート値'));
      list.appendChild(hr);
      if (!top50) list.appendChild(el('div', 'bf-empty', `この記録には「${m.label}」のレート対象曲がありません（以前の版で登録された記録です。登録し直すと表示されます）。`));
      else if (!top50.length) list.appendChild(el('div', 'bf-empty', 'ベスト枠のデータがありません。'));
      (top50 || []).forEach((t, i) => {
        const row = el('div', 'bf-row');
        const song = bfResolveSong(jk.map, jk.overrides, t.name, t.kind, t.diff, t.level, t.max);
        let jacket;
        if (song?.img) {
          jacket = el('img', 'bf-jk');
          let k = 0;
          jacket.alt = '';
          jacket.loading = 'lazy';
          jacket.src = JACKET_BASES[0] + song.img;
          jacket.onerror = () => { k++; if (k < JACKET_BASES.length) jacket.src = JACKET_BASES[k] + song.img; else jacket.replaceWith(el('div', 'bf-jk')); };
        } else {
          jacket = el('div', 'bf-jk');
        }
        const main = el('div');
        const nm = el('div', 'bf-title', t.name);
        if (song?.genre) nm.appendChild(el('span', 'bf-genre', `（${song.genre}）`));
        const chips = el('div', 'bf-chips');
        const diff = el('span', 'bf-chip bf-diff', t.diff);
        if (t.diff === 'Re:MASTER') diff.classList.add('bf-remas');
        else diff.style.background = BF_DIFF_COLOR[t.diff] || '#999';
        const isMax = t.score === t.max;
        const maxText = isMax ? 'MAX' : `MAX-${(t.max - t.score).toLocaleString()}`;
        chips.append(
          el('span', `bf-chip bf-kind-${t.kind === 'ST' ? 'ST' : 'DX'}`, t.kind),
          diff,
          el('span', 'bf-chip bf-const', `${Number(t.const).toFixed(1)}${t.estimated ? '*' : ''}`),
          el('span', 'bf-maxinline' + (isMax ? ' is-max' : ''), maxText)
        );
        main.append(nm, chips);
        const star = el('div', 'bf-c');
        star.appendChild(el('span', `bf-star ${bfStarClass(Math.floor(Number(t.star)))}`, `☆${Number(t.star).toFixed(1)}`));
        row.append(
          el('div', 'bf-no', String(i + 1)),
          jacket,
          main,
          star,
          el('div', 'bf-r bf-maxcol' + (isMax ? ' is-max' : ''), maxText),
          el('div', 'bf-r bf-value', Number(t.value).toFixed(3))
        );
        list.appendChild(row);
      });
      if (old) old.replaceWith(list); else box.appendChild(list);
    }
    show(startId);
    document.body.appendChild(ov);
    x.focus();
  }

  let jackets = null;
  let overrides = {};
  let openUser = null; // レート対象曲を開いている人（username）

  // レート対象曲の一覧
  function detailEl(r) {
    const box = el('div', 'detail');
    box.addEventListener('click', (e) => e.stopPropagation());
    const head = el('div', 'detail-head');
    head.append(el('span', '', `☆7までのレート対象曲（${r.top50.length} 譜面）`),
      el('span', '', `ユーザー名：${r.username}　登録 ${dateOf(r.createdAt)}　計算式 ${r.formulaVersion || '-'}`));
    box.appendChild(head);
    if (!r.top50.length) {
      box.appendChild(el('div', 'empty', 'レート対象曲のデータがありません（古い版で登録された記録です）。'));
      return box;
    }
    r.top50.forEach((t, i) => {
      const row = el('div', 't');
      const song = resolveSong(jackets, overrides, t.name, t.kind, t.diff, t.level, t.max);
      const main = el('div');
      const nm = el('div', 't-name', t.name);
      if (song?.genre) nm.appendChild(el('span', 'admin-meta', `（${song.genre}）`));
      main.appendChild(nm);
      const chips = el('div', 'chips');
      chips.append(
        el('span', `chip kind-${t.kind}`, t.kind),
        el('span', `chip diff-${String(t.diff).replace(':', '').toUpperCase()}`, t.diff),
        el('span', 'chip const', `${Number(t.const).toFixed(1)}${t.estimated ? '*' : ''}`),
        el('span', 'chip score', t.score === t.max ? `MAX ${t.max}` : `${t.score} / ${t.max}（MAX-${t.max - t.score}）`)
      );
      main.appendChild(chips);
      row.append(
        el('div', 't-rank', String(i + 1)),
        jacketEl(song?.img),
        main,
        el('span', `star ${starClass(t.star)}`, `☆${Number(t.star).toFixed(1)}`),
        el('div', 't-val', Number(t.value).toFixed(3))
      );
      box.appendChild(row);
    });
    return box;
  }

  let all = [];
  let adminKey = '';
  let mode = MODES[0];
  let version = null;
  // 計算式の版（v1 / v2 / v3 …）の切り替え。null は「すべて」
  let formula = null;
  const formulaNo = (v) => Number(String(v || '').replace(/^v/, '')) || 0;
  let query = '';

  function renderTabs() {
    const mt = $('modeTabs');
    mt.replaceChildren();
    MODES.forEach((m) => {
      const b = el('button', '', m.label);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(m === mode));
      b.onclick = () => { mode = m; renderTabs(); renderList(); };
      mt.appendChild(b);
    });
    // 定数表のバージョンが複数あるときだけ切り替えを出す
    const vers = [...new Set(all.map((r) => r.constVersion).filter(Boolean))];
    const vt = $('verTabs');
    vt.replaceChildren();
    if (vers.length > 1) {
      vers.forEach((v) => {
        const b = el('button', '', v);
        b.type = 'button';
        b.setAttribute('aria-pressed', String(v === version));
        b.onclick = () => { version = v; renderTabs(); renderList(); };
        vt.appendChild(b);
      });
    }
    // 計算式の版：記録にある版をすべて並べる（「すべて」＋ 版ごと）
    const fvs = [...new Set(all.map((r) => r.formulaVersion || '不明'))].sort((a, b) => formulaNo(a) - formulaNo(b));
    const ft = $('formulaTabs');
    ft.replaceChildren(el('span', 'tab-label', '計算式'));
    [null, ...fvs].forEach((v) => {
      const n = v === null ? 0 : all.filter((r) => (r.formulaVersion || '不明') === v).length;
      const b = el('button', '', v === null ? 'すべて' : `${v}（${n}）`);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(v === formula));
      b.onclick = () => { formula = v; renderTabs(); renderList(); };
      ft.appendChild(b);
    });
  }

  function renderList() {
    const q = query.trim().toLowerCase();
    const sorted = all
      .filter((r) => !version || r.constVersion === version)
      .filter((r) => !formula || (r.formulaVersion || '不明') === formula)
      .filter((r) => Number.isFinite(valueOf(r, mode)))
      .sort((a, b) => valueOf(b, mode) - valueOf(a, mode));
    // 順位は同じ値なら同順位（絞り込み前の並びで決める）
    const posOf = new Map();
    sorted.forEach((r, i) => {
      const prev = sorted[i - 1];
      posOf.set(r, prev && valueOf(prev, mode) === valueOf(r, mode) ? posOf.get(prev) : i + 1);
    });
    const items = sorted.filter((r) => !q || r.name.toLowerCase().includes(q) || r.username.includes(q) || (r.displayName || '').toLowerCase().includes(q));
    const conds = [version && `定数表：${version}`, formula && `計算式：${formula}`].filter(Boolean);
    $('info').textContent = `${sorted.length} 人が登録` + (conds.length ? `（${conds.join('・')}）` : '');

    const list = el('div', 'list');
    if (!items.length) list.appendChild(el('div', 'empty', '該当する記録はありません。'));
    items.forEach((r) => {
      const row = el('div', 'r');
      const pos = posOf.get(r);
      row.appendChild(el('div', 'pos' + (pos <= 3 ? ` top${pos}` : ''), String(pos)));

      if (r.icon && /^[0-9a-f]{16}\.png$/.test(r.icon)) {
        const img = el('img', 'icon');
        img.src = ICON_BASE + r.icon;
        img.alt = '';
        img.loading = 'lazy';
        img.onerror = () => img.replaceWith(defaultIcon('icon'));
        row.appendChild(img);
      } else {
        row.appendChild(defaultIcon('icon'));
      }

      const main = el('div');
      const nm = el('div', 'name' + (r.anonymous ? ' anon' : ''), r.name);
      if (r.hidden) nm.appendChild(el('span', 'tag', '非表示'));
      nm.appendChild(el('span', r.publicTop50 ? 'tag pub' : 'tag priv', r.publicTop50 ? 'ベスト枠公開' : 'ベスト枠非公開'));
      main.append(nm, el('div', 'meta', `更新 ${dateOf(r.updatedAt)}`), ...(r.counts ? [el('div', 'meta', countsText(r))] : []),
        el('div', 'admin-meta', `@${r.username}` + (r.anonymous && r.displayName ? `（表示名：${r.displayName}）` : '')));
      row.appendChild(main);
      row.classList.add('user');
      row.tabIndex = 0;
      row.setAttribute('role', 'button');
      const toggle = async () => {
        if (!r.top50) {
          row.style.opacity = '.6';
          try {
            const res = await fetch(RANKING_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: 'adminTop50', key: adminKey, username: r.username }) });
            const d = await res.json();
            if (!d.ok) throw new Error(d.error || '読み込めませんでした。');
            r.top50 = framesOf(d.top50);
          } catch (e) {
            alert(e.message || 'ベスト枠を読み込めませんでした。');
            return;
          } finally {
            row.style.opacity = '';
          }
        }
        openBestFrame({ name: r.name, icon: r.icon, rateFull: r.rateFull, rateCap6: r.rateCap6, rateCap5: r.rateCap5 },
          r.top50, { map: jackets, overrides }, mode.id);
      };
      row.onclick = toggle;
      row.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } };


      const right = el('div');
      const rate = el('div', 'rate');
      const v = valueOf(r, mode);
      if (mode.count) {
        const val = el('span', 'rate-value', String(v));
        val.appendChild(el('span', 'count-unit', '譜面'));
        rate.appendChild(val);
        right.append(rate, el('div', 'rank-name', `MAS ${r.counts[mode.mas]} ／ Re:MAS ${r.counts[mode.re]}`));
      } else {
      const val = el('span', 'rate-value', v.toFixed(3));
        const rank = rankOf(v, mode.shift);
        const ic = el('span', 'rank-icon');
        ic.innerHTML = rankIconSvg(rank.name); // ページ内で作る固定のSVGのみ
        val.classList.add('ranked');
        val.style.backgroundImage = `linear-gradient(90deg, ${rank.colors.join(', ')})`;
        if (rank.glow) val.style.filter = `drop-shadow(0 0 3px ${rank.glow})`;
        rate.append(ic, val);
        right.append(rate, el('div', 'rank-name', rank.name));
      }
      row.appendChild(right);
      list.appendChild(row);
    });
    $('listBox').replaceChildren(list);
  }

  async function load(key) {
    $('status').classList.remove('error');
    $('status').textContent = '読み込み中…';
    try {
      const [res, jmap, ov] = await Promise.all([
        fetch(RANKING_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'admin', key }) }),
        fetch(JACKETS_URL + '?' + Date.now()).then((r) => (r.ok ? r.json() : null)).catch(() => null),
        fetch(OVERRIDES_URL + '?' + Date.now()).then((r) => (r.ok ? r.json() : {})).catch(() => ({})),
      ]);
      const data = await res.json();
      if (!data.ok) {
        $('status').textContent = data.error || '読み込めませんでした。';
        $('status').classList.add('error');
        return;
      }
      jackets = jmap ? new Map(Object.entries(jmap)) : null;
      overrides = ov || {};
      adminKey = key;
      // 一覧にベスト枠が含まれていない場合（Cloudflare 版）は、開いたときに1人ずつ取り出す
      all = (data.list || []).filter((r) => r && typeof r.name === 'string')
        .map((r) => ({ ...r, top50: r.top50 && typeof r.top50 === 'object' ? framesOf(r.top50) : null }));
    } catch (e) {
      $('status').textContent = '読み込めませんでした。時間をおいてもう一度お試しください。';
      $('status').classList.add('error');
      return;
    }
    const count = {};
    all.forEach((r) => { if (r.constVersion) count[r.constVersion] = (count[r.constVersion] || 0) + 1; });
    version = Object.keys(count).sort((a, b) => count[b] - count[a])[0] || null;
    $('status').textContent = '';
    $('app').hidden = false;
    renderTabs();
    renderList();
  }

  let timer = null;
  $('search').addEventListener('input', (e) => {
    clearTimeout(timer);
    timer = setTimeout(() => { query = e.target.value; renderList(); }, 250);
  });
  $('login').addEventListener('submit', (e) => {
    e.preventDefault();
    const key = $('key').value.trim();
    if (key) load(key);
  });

})();
</script>
</body>
</html>
